name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: world, risk model, device matrix, guardrails, ticket reader, engine, service, invariants
        run: python -m pytest
      - name: the development orgs evaluated again give the committed reports
        run: |
          python -m raq.eval.cli evaluate
          git diff --exit-code reports/dev.json reports/charts README.md
      - name: development gate; README matches
        run: python -m raq.eval.cli gate --dev && python -m raq.eval.cli readme --check
      - name: the held-out run happened once and is locked
        run: test -f config/heldout.lock && test -f reports/heldout.json && ! python -m raq.eval.cli heldout

  contracts:
    name: backend, contracts (Pact)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: the app's consumer tests write the contract; the backend is verified against it; cash-out tests
        run: gradle :api-client:test :backend:test --no-daemon --stacktrace
      - name: the contract the backend was verified against
        if: always()
        run: ls -la contracts/pacts && cat contracts/pacts/*.json | head -c 4000

  android:
    name: Android app, Espresso and Maestro on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: build the app, its instrumented tests and the backend
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :backend:installDist --no-daemon
      - name: start the backend the emulator talks to (10.0.2.2:8080)
        run: |
          nohup backend/build/install/backend/bin/backend > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/healthz
      - name: install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Espresso, then Maestro flows (sign in, cash out, double tap)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            maestro test maestro/ --format junit --output /tmp/maestro.xml
      - name: backend log and test reports
        if: always()
        run: |
          tail -50 /tmp/backend.log || true
          cat /tmp/maestro.xml || true

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r ../requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: dashboard end to end, with axe
        run: pnpm e2e

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t raq-dashboard .
