[project]
name = "reward-app-quality-platform"
version = "0.1.0"
requires-python = ">=3.12"
description = "Quality platform for a rewarded mobile-gaming app, measured on simulated releases."

[tool.ruff]
line-length = 160
target-version = "py312"
exclude = ["web", "mobile"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "SIM108", "E741", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
